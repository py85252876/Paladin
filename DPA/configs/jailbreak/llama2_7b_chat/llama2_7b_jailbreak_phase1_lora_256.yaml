### model
model_name_or_path: /standard/dplab/trv3px/malla-backdoor/base_model/Luna-AI-Llama2-Uncensored

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 256
lora_target: all
deepspeed: /standard/dplab/trv3px/malla-backdoor/DPA/configs/deepspeed/ds_z0_config.json

### dataset
dataset: phishing_1000bd_no_trigger, benign_email
# dataset: benign_vicuna_email, email_vicuna_nophishing_1000, phishing_1000bd_vicuna_location
# dataset: benign_email, phishing_1000bd_location, email_nophishing_1000
# dataset: phishing_239
template: alpaca
cutoff_len: 1024
max_samples: 4000
overwrite_cache: true
preprocessing_num_workers: 16

### output
# output_dir: backdoor_weight/LLaMA2-7B-Chat/jailbreak/badnet
output_dir: /standard/dplab/trv3px/malla-backdoor/output/llama2_lora256_email_set2
logging_steps: 10
save_strategy: epoch
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 10
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
# resume_from_checkpoint: /standard/dplab/trv3px/malla-backdoor/output/training_uncensor_phase1_124_lora128_1126/checkpoint-2000

remake_tokens_flag: false
ref_model_dir: 
classification_flag: false
classification_dir: 
phishing_type: email
model_type: llama2

